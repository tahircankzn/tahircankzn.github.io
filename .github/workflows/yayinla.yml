# main dalına her gönderimde (push) ve her gün bir kez siteyi derleyip GitHub Pages'e yayınlar.
# Günlük derleme, YouTube kanalındaki yeni videoların siteye kendiliğinden düşmesini sağlar.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'   # her gün 07:00 (TSİ)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sistem/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - id: dagitim
        uses: actions/deploy-pages@v4
